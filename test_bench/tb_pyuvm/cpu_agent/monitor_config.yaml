# monitor_config.yaml - Configuration for DHRUT-V CPU Pipeline Monitor Display
# This YAML file defines all pipeline stages, their signals, and display formats
# It works with the dynamic CpuMonitor that reads this config at runtime

stages:
  # ─────────────────────────────────────────────────────────────────────────
  # FETCH Stage - Instruction Fetch from Memory
  # ─────────────────────────────────────────────────────────────────────────
  FETCH:
    display_name: "FETCH"
    description: "Instruction Fetch stage - retrieves instructions from memory"
    signals:
      # Valid signal from IF/ID pipeline register
      - name: "valid"
        signal_path: "if_id_valid"
        format: "{:1d}"
        type: "bool"
        description: "Instruction valid"
      
      # Program Counter
      - name: "PC"
        signal_path: "if_id_pc"
        format: "0x{:08x}"
        type: "int"
        description: "Program Counter"
      
      # Instruction encoding (32-bit RISC-V)
      - name: "instr"
        signal_path: "if_id_instr"
        format: "0x{:08x}"
        type: "int"
        description: "Raw instruction bits"
      
      # How many queue entries decode consumed this cycle (0..2).
      # 0 is the new "stalled": there is no stall wire any more.
      - name: "pop_cnt"
        signal_path: "decode_pop_cnt"
        format: "{:1d}"
        type: "int"
        description: "Fetch-queue entries taken by decode this cycle"

  # ─────────────────────────────────────────────────────────────────────────
  # DECODE Stage - Instruction Decoding and UOP Generation
  # ───────────────────────────────────────────────────────────────────────────
  DECODE:
    display_name: "DECODE"
    description: "Instruction Decode stage - translates instructions to microops"
    signals:
      # Valid micro-operation signal
      - name: "valid"
        signal_path: "id_issue_valid"
        format: "{:1d}"
        type: "bool"
        description: "UOP valid"
      
      # Program Counter passed through decode
      - name: "PC"
        signal_path: "id_issue_pc"
        format: "0x{:08x}"
        type: "int"
        description: "PC of decoded instruction"
      
      # UOP opcode/operation type - EXTRACTED from packed id_issue_uop
      - name: "opcode"
        signal_path: "uop_opcode"
        format: "0x{:02x}"
        type: "int"
        description: "UOP opcode (7 bits) - extracted from id_issue_uop"
        source: "uop_extraction"
      
      # Destination register - EXTRACTED from packed id_issue_uop
      - name: "rd"
        signal_path: "uop_rd"
        format: "x{:02d}"
        type: "int"
        description: "Destination register - extracted from id_issue_uop"
        source: "uop_extraction"
      
      # Source register 1 - EXTRACTED from packed id_issue_uop
      - name: "rs1"
        signal_path: "uop_rs1"
        format: "x{:02d}"
        type: "int"
        description: "Source register 1 - extracted from id_issue_uop"
        source: "uop_extraction"
      
      # Source register 2 - EXTRACTED from packed id_issue_uop
      - name: "rs2"
        signal_path: "uop_rs2"
        format: "x{:02d}"
        type: "int"
        description: "Source register 2 - extracted from id_issue_uop"
        source: "uop_extraction"
      
      # Register write enable - EXTRACTED from packed id_issue_uop
      - name: "wr"
        signal_path: "uop_writes_rd"
        format: "{:1d}"
        type: "bool"
        description: "Writes destination register - extracted from id_issue_uop"
        source: "uop_extraction"
      
      # Immediate value - EXTRACTED from packed id_issue_uop
      - name: "imm"
        signal_path: "uop_imm"
        format: "{:#x}"
        type: "int"
        description: "Sign-extended immediate - extracted from id_issue_uop"
        source: "uop_extraction"

      # Load signal - EXTRACTED from packed id_issue_uop
      - name: "load"
        signal_path: "uop_is_load"
        format: "{:1d}"
        type: "bool"
        description: "Is load instruction - extracted from id_issue_uop"
        source: "uop_extraction"

      # Store signal - EXTRACTED from packed id_issue_uop
      - name: "store"
        signal_path: "uop_is_store"
        format: "{:1d}"
        type: "bool"
        description: "Is store instruction - extracted from id_issue_uop"
        source: "uop_extraction"

  # ─────────────────────────────────────────────────────────────────────────
  # ISSUE Stage - Instruction Scheduling and Register File Access
  # ─────────────────────────────────────────────────────────────────────────
  ISSUE:
    display_name: "ISSUE"
    description: "Issue stage - schedules UOPs and accesses register file"
    signals:
      # Valid micro-operation in issue buffer
      - name: "valid"
        signal_path: "ISSUE.buf_valid_q"
        format: "{:1d}"
        type: "bool"
        description: "UOP in issue buffer is valid"

      # Program Counter in issue buffer
      - name: "PC"
        signal_path: "ISSUE.buf_pc_q"
        format: "0x{:08x}"
        type: "int"
        description: "PC of instruction in issue buffer"

      # Opcode in issue buffer
      - name: "opcode"
        signal_path: "uop_iss_opcode"
        format: "0x{:02x}"
        type: "int"
        description: "Opcode of instruction in issue buffer"
        source: "uop_issue_extraction"

      # Dispatch destination
      - name: "to_ALU"
        signal_path: "alu_if.m_valid"
        format: "{:1d}"
        type: "bool"
        description: "Issued to ALU"
      
      - name: "to_LSU"
        signal_path: "lsu_if.m_valid"
        format: "{:1d}"
        type: "bool"
        description: "Issued to LSU"

      # Branch/Jump resolution
      - name: "br_taken"
        signal_path: "ISSUE.o_branch_taken"
        format: "{:1d}"
        type: "bool"
        description: "Branch/Jump decision"

      # Branch/Jump target
      - name: "br_target"
        signal_path: "ISSUE.o_branch_target"
        format: "0x{:08x}"
        type: "int"
        description: "Branch/Jump target address"
      
      # ALU operands (from ISSUE stage perspectives)
      - name: "op1"
        signal_path: "ISSUE.op1"
        format: "0x{:08x}"
        type: "int"
        description: "Resolved operand 1 (with forwarding)"
      
      - name: "op2"
        signal_path: "ISSUE.op2"
        format: "0x{:08x}"
        type: "int"
        description: "Resolved operand 2 (with forwarding)"

      # Stall signal to decode
      - name: "stall_ID"
        signal_path: "issue_to_decode_stall"
        format: "{:1d}"
        type: "bool"
        description: "Stall signal back to decode stage"

  # ─────────────────────────────────────────────────────────────────────────
  # ALU Stage - Arithmetic/Logic Execution
  # ─────────────────────────────────────────────────────────────────────────
  ALU:
    display_name: "ALU"
    description: "ALU execution stage - performs arithmetic and logic operations"
    signals:
      # Valid micro-operation signal
      - name: "valid"
        signal_path: "ALU.valid_q"
        format: "{:1d}"
        type: "bool"
        description: "ALU operation in progress"

      # Program Counter
      - name: "PC"
        signal_path: "ALU.pc_q"
        format: "0x{:08x}"
        type: "int"
        description: "PC of instruction in ALU"

      # ALU opcode
      - name: "opcode"
        signal_path: "uop_alu_opcode"
        format: "0x{:02x}"
        type: "int"
        description: "UOP opcode in ALU"
        source: "uop_alu_extraction"

      # ALU operand 1
      - name: "op1"
        signal_path: "ALU.op1_q"
        format: "0x{:08x}"
        type: "int"
        description: "ALU operand 1"

      # ALU operand 2
      - name: "op2"
        signal_path: "ALU.op2_q"
        format: "0x{:08x}"
        type: "int"
        description: "ALU operand 2"

      # ALU result value
      - name: "result"
        signal_path: "ALU.alu_result"
        format: "0x{:08x}"
        type: "int"
        description: "ALU result value"

  # ─────────────────────────────────────────────────────────────────────────
  # LSU Stage - Load/Store Execution
  # ─────────────────────────────────────────────────────────────────────────
  LSU:
    display_name: "LSU"
    description: "Load/Store Unit - handles memory access, forwards loads, signals stalls"
    signals:
      # LSU retire valid
      - name: "valid"
        signal_path: "LSU.valid_q"
        format: "{:1d}"
        type: "bool"
        description: "LSU operation in progress"

      # Instruction PC in LSU
      - name: "PC"
        signal_path: "LSU.pc_q"
        format: "0x{:08x}"
        type: "int"
        description: "PC of instruction in LSU"

      # Is load instruction
      - name: "load"
        signal_path: "uop_lsu_is_load"
        format: "{:1d}"
        type: "bool"
        description: "Instruction is a load"
        source: "uop_lsu_extraction"

      # Is store instruction
      - name: "store"
        signal_path: "uop_lsu_is_store"
        format: "{:1d}"
        type: "bool"
        description: "Instruction is a store"
        source: "uop_lsu_extraction"

      # Computed memory address
      - name: "addr"
        signal_path: "LSU.mem_addr"
        format: "0x{:08x}"
        type: "int"
        description: "Final memory address"

      # Store data (if store)
      - name: "sdata"
        signal_path: "LSU.store_data_q"
        format: "0x{:08x}"
        type: "int"
        description: "Store data"

      # Load result data
      - name: "ldata"
        signal_path: "LSU.o_load_data"
        format: "0x{:08x}"
        type: "int"
        description: "Processed load data"

      # Stall from LSU
      - name: "stall"
        signal_path: "lsu_if.s_stall_from_lsu"
        format: "{:1d}"
        type: "bool"
        description: "Stall signal to pipeline from LSU"

  # ─────────────────────────────────────────────────────────────────────────
  # BPU Stage - Branch Prediction Unit ports (prediction + update/training)
  # ─────────────────────────────────────────────────────────────────────────
  BPU:
    display_name: "BPU"
    description: "Branch Prediction Unit - prediction and update/training ports"
    signals:
      - name: "pred_is_br"
        signal_path: "bpu_pred_is_branch"
        format: "{:1d}"
        type: "bool"
        description: "IF requesting a prediction for a branch"

      - name: "pred_pc"
        signal_path: "bpu_pred_pc"
        format: "0x{:08x}"
        type: "int"
        description: "PC being predicted"

      - name: "pred_off_pc"
        signal_path: "bpu_pred_offset_pc"
        format: "0x{:08x}"
        type: "int"
        description: "Offset PC used for prediction lookup"

      - name: "pred_taken"
        signal_path: "bpu_pred_taken"
        format: "{:1d}"
        type: "bool"
        description: "BPU predicted taken"

      - name: "pred_target"
        signal_path: "bpu_pred_target"
        format: "0x{:08x}"
        type: "int"
        description: "BPU predicted target address"

      - name: "upd_valid"
        signal_path: "bpu_update_valid"
        format: "{:1d}"
        type: "bool"
        description: "BPU update/training pulse from Issue"

      - name: "upd_pc"
        signal_path: "bpu_update_pc"
        format: "0x{:08x}"
        type: "int"
        description: "PC of resolved branch used to update BPU"

      - name: "upd_taken"
        signal_path: "bpu_update_taken"
        format: "{:1d}"
        type: "bool"
        description: "Actual resolved taken outcome"

      - name: "upd_target"
        signal_path: "bpu_update_target"
        format: "0x{:08x}"
        type: "int"
        description: "Actual resolved target address"

      - name: "if_pred_taken"
        signal_path: "if_id_pred_taken"
        format: "{:1d}"
        type: "bool"
        description: "Prediction carried into decode alongside the instruction"

      - name: "if_pred_target"
        signal_path: "if_id_pred_target"
        format: "0x{:08x}"
        type: "int"
        description: "Predicted target carried into decode"

  # ─────────────────────────────────────────────────────────────────────────
  # REDIRECT - Misprediction resolution / redirect (top-level, Issue -> IF)
  # ─────────────────────────────────────────────────────────────────────────
  REDIRECT:
    display_name: "REDIRECT"
    description: "Branch resolution outcome and misprediction redirect"
    signals:
      - name: "br_taken"
        signal_path: "branch_taken"
        format: "{:1d}"
        type: "bool"
        description: "Actual resolved branch/jump taken outcome (Issue)"

      - name: "br_target"
        signal_path: "branch_target"
        format: "0x{:08x}"
        type: "int"
        description: "Actual resolved branch/jump target (Issue)"

      - name: "mispredict"
        signal_path: "mispredict"
        format: "{:1d}"
        type: "bool"
        description: "Misprediction detected -> flush IF/ID/Issue"

      - name: "redirect_pc"
        signal_path: "redirect_pc"
        format: "0x{:08x}"
        type: "int"
        description: "Corrected redirect PC on misprediction"

  # ─────────────────────────────────────────────────────────────────────────
  # FORWARD - Operand forwarding buses into ISSUE
  # ─────────────────────────────────────────────────────────────────────────
  FORWARD:
    display_name: "FWD"
    description: "Operand forwarding buses from ALU/LSU/Retire back into Issue"
    signals:
      - name: "alu_rd"
        signal_path: "fwd_alu_issue_rd"
        format: "x{:02d}"
        type: "int"
        description: "ALU forward destination register"

      - name: "alu_data"
        signal_path: "fwd_alu_issue_data"
        format: "0x{:08x}"
        type: "int"
        description: "ALU forward data"

      - name: "alu_wr"
        signal_path: "fwd_alu_issue_writes_rd"
        format: "{:1d}"
        type: "bool"
        description: "ALU forward writes_rd qualifier"

      - name: "lsu_rd"
        signal_path: "fwd_lsu_issue_rd"
        format: "x{:02d}"
        type: "int"
        description: "LSU forward destination register"

      - name: "lsu_data"
        signal_path: "fwd_lsu_issue_data"
        format: "0x{:08x}"
        type: "int"
        description: "LSU forward data"

      - name: "ret_rd"
        signal_path: "fwd_retire_issue_rd"
        format: "x{:02d}"
        type: "int"
        description: "Retire forward destination register"

      - name: "ret_data"
        signal_path: "fwd_retire_issue_data"
        format: "0x{:08x}"
        type: "int"
        description: "Retire forward data"

      - name: "ret_wr"
        signal_path: "fwd_retire_issue_writes_rd"
        format: "{:1d}"
        type: "bool"
        description: "Retire forward writes_rd qualifier"

  # ─────────────────────────────────────────────────────────────────────────
  # CSR - CSR read/write resolution and trap/mret redirect (inside ISSUE)
  # ─────────────────────────────────────────────────────────────────────────
  CSR:
    display_name: "CSR"
    description: "CSR read/write and trap/mret resolution (rtl/pipeline/csr_unit.sv, instantiated by issue.sv)"
    signals:
      - name: "trap"
        signal_path: "ISSUE.CSR_UNIT.trap_taken"
        format: "{:1d}"
        type: "bool"
        description: "Trap entry firing this cycle (illegal instr / ecall / ebreak)"

      - name: "mret"
        signal_path: "ISSUE.CSR_UNIT.mret_taken"
        format: "{:1d}"
        type: "bool"
        description: "MRET firing this cycle"

      - name: "cause"
        signal_path: "ISSUE.CSR_UNIT.trap_cause_code"
        format: "0x{:08x}"
        type: "int"
        description: "Trap cause about to be written to mcause"

      - name: "csr_we"
        signal_path: "ISSUE.CSR_UNIT.csr_we"
        format: "{:1d}"
        type: "bool"
        description: "CSR register file write enable this cycle"

      - name: "illegal"
        signal_path: "ISSUE.CSR_UNIT.overall_illegal"
        format: "{:1d}"
        type: "bool"
        description: "Illegal instruction/CSR-address condition this cycle"

      - name: "mstatus_mie"
        signal_path: "ISSUE.CSR_UNIT.csr_hwif_out.mstatus.MIE.value"
        format: "{:1d}"
        type: "bool"
        description: "mstatus.MIE (live CSR state)"

      - name: "mstatus_mpie"
        signal_path: "ISSUE.CSR_UNIT.csr_hwif_out.mstatus.MPIE.value"
        format: "{:1d}"
        type: "bool"
        description: "mstatus.MPIE (live CSR state)"

      - name: "mepc"
        signal_path: "ISSUE.CSR_UNIT.csr_mepc_out"
        format: "0x{:08x}"
        type: "int"
        description: "mepc (live CSR state)"

      - name: "mcause"
        signal_path: "ISSUE.CSR_UNIT.csr_hwif_out.mcause.MCAUSE.value"
        format: "0x{:08x}"
        type: "int"
        description: "mcause (live CSR state)"

      - name: "mtval"
        signal_path: "ISSUE.CSR_UNIT.csr_hwif_out.mtval.MTVAL.value"
        format: "0x{:08x}"
        type: "int"
        description: "mtval (live CSR state)"

      - name: "mtvec"
        signal_path: "ISSUE.CSR_UNIT.csr_hwif_out.mtvec.MTVEC.value"
        format: "0x{:08x}"
        type: "int"
        description: "mtvec (live CSR state)"

  # ─────────────────────────────────────────────────────────────────────────
  # RETIRE Stage - Writeback to Register File and Commit
  # ─────────────────────────────────────────────────────────────────────────
  RETIRE:
    display_name: "RETIRE"
    description: "Retire stage - commits results to register file"
    signals:
      # Register file write enable
      - name: "wb_en"
        signal_path: "retire_wb_en"
        format: "{:1d}"
        type: "bool"
        description: "Write-back enabled"
      
      # Destination register (write-back)
      - name: "wb_rd"
        signal_path: "retire_wb_rd"
        format: "x{:02d}"
        type: "int"
        description: "Write-back register"
      
      # Write-back data
      - name: "wb_data"
        signal_path: "retire_wb_data"
        format: "0x{:08x}"
        type: "int"
        description: "Write-back data value"

# ───────────────────────────────────────────────────────────────────────────
# Optional: Define which stages to display (subset of available stages)
# ───────────────────────────────────────────────────────────────────────────
display_stages: ["FETCH", "DECODE", "ISSUE", "ALU", "LSU", "RETIRE", "BPU", "REDIRECT", "FORWARD", "CSR"]

# ───────────────────────────────────────────────────────────────────────────
# UOP Bit Extraction Configuration
#
# uop_t (rtl/include/riscv_uop_pkg.sv) is now 145 bits wide (grew from 112
# when `is_illegal`(1) and `instr_bits`(32) were appended for M7 CSR/trap
# support — is_illegal flags an illegal-instruction trap at Issue, and
# instr_bits carries the raw fetched instruction through for mtval on that
# trap). Packed-struct field order below mirrors the SV declaration order
# (first field declared = MSB):
#   valid(1) opcode(7) alu_op(10) rs1(5) rs2(5) rd(5) funct3(3) imm(32)
#   uses_rs1(1) uses_rs2(1) writes_rd(1) is_immediate(1) is_branch(1)
#   is_jump(1) is_load(1) is_store(1) lsu_sign_extend(1) lsu_access_size(2)
#   pred_taken(1) pred_target(32) is_illegal(1) instr_bits(32) => bit 144 downto 0
# ───────────────────────────────────────────────────────────────────────────
uop_extraction:
  signal_path: "id_issue_uop"
  fields:
    - name: "uop_valid"
      bits: [144, 144]
    - name: "uop_opcode"
      bits: [143, 137]
    - name: "uop_alu_op"
      bits: [136, 127]
    - name: "uop_rs1"
      bits: [126, 122]
    - name: "uop_rs2"
      bits: [121, 117]
    - name: "uop_rd"
      bits: [116, 112]
    - name: "uop_funct3"
      bits: [111, 109]
    - name: "uop_imm"
      bits: [108, 77]
    - name: "uop_uses_rs1"
      bits: [76, 76]
    - name: "uop_uses_rs2"
      bits: [75, 75]
    - name: "uop_writes_rd"
      bits: [74, 74]
    - name: "uop_is_immediate"
      bits: [73, 73]
    - name: "uop_is_branch"
      bits: [72, 72]
    - name: "uop_is_jump"
      bits: [71, 71]
    - name: "uop_is_load"
      bits: [70, 70]
    - name: "uop_is_store"
      bits: [69, 69]
    - name: "uop_pred_taken"
      bits: [65, 65]
    - name: "uop_pred_target"
      bits: [64, 33]
    - name: "uop_is_illegal"
      bits: [32, 32]
    - name: "uop_instr_bits"
      bits: [31, 0]

uop_issue_extraction:
  signal_path: "ISSUE.buf_uop_q"
  fields:
    - name: "uop_iss_opcode"
      bits: [143, 137]
    - name: "uop_iss_is_branch"
      bits: [72, 72]
    - name: "uop_iss_is_jump"
      bits: [71, 71]
    - name: "uop_iss_is_illegal"
      bits: [32, 32]

uop_alu_extraction:
  signal_path: "ALU.uop_q"
  fields:
    - name: "uop_alu_opcode"
      bits: [143, 137]
    - name: "uop_alu_op"
      bits: [136, 127]
    - name: "uop_alu_rs1"
      bits: [126, 122]
    - name: "uop_alu_rs2"
      bits: [121, 117]
    - name: "uop_alu_rd"
      bits: [116, 112]
    - name: "uop_alu_funct3"
      bits: [111, 109]
    - name: "uop_alu_imm"
      bits: [108, 77]
    - name: "uop_alu_writes_rd"
      bits: [74, 74]
    - name: "uop_alu_is_immediate"
      bits: [73, 73]
    - name: "uop_alu_is_branch"
      bits: [72, 72]
    - name: "uop_alu_is_jump"
      bits: [71, 71]

uop_lsu_extraction:
  signal_path: "LSU.uop_q"
  fields:
    - name: "uop_lsu_opcode"
      bits: [143, 137]
    - name: "uop_lsu_rs1"
      bits: [126, 122]
    - name: "uop_lsu_rs2"
      bits: [121, 117]
    - name: "uop_lsu_rd"
      bits: [116, 112]
    - name: "uop_lsu_funct3"
      bits: [111, 109]
    - name: "uop_lsu_imm"
      bits: [108, 77]
    - name: "uop_lsu_writes_rd"
      bits: [74, 74]
    - name: "uop_lsu_is_load"
      bits: [70, 70]
    - name: "uop_lsu_is_store"
      bits: [69, 69]

# ───────────────────────────────────────────────────────────────────────────
# Display Configuration
# ───────────────────────────────────────────────────────────────────────────
display_config:
  log_level: "INFO"
  print_full_items: true
  print_only_valid: false
  timestamp_unit: "ns"
  use_colors: true
